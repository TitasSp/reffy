<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reffy</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="title-bar"></div>

  <div id="side-menu" class="collapsed">
    <button id="menu-toggle">☰</button>
    <div class="menu-content">
      <button id="saveScene">Save</button>
      <button id="loadTriggerBtn">Load</button>
      <input type="file" id="loadScene" accept=".json">
      <button id="stayOnTopBtn">Stay on Top</button>
      <button id="undoBtn">Undo</button>
      <button id="redoBtn">Redo</button>
      <button id="clearBtn">Clear</button>
      <button id="helpBtn">Shortcuts</button>
    </div>
  </div>

  <div id="selectionBox"></div>
  <canvas id="selectionCanvas"></canvas>

  <div class="scroll-container">
    <div id="canvas"></div>
  </div>

  <div id="placeholder" class="placeholder">Drop images or paste from clipboard</div>

  <div id="status-bar">
    <span id="selection-info">No selection</span>
    <span id="zoom-info">Zoom: <span id="zoom-level">100%</span></span>
    <span id="image-count">0 items</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
